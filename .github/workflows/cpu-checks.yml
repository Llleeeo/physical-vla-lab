name: CPU contract checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-cpu.txt
      - run: python scripts/check_publication.py
      - run: >-
          python -m pytest -q
          tests/test_hgwind_cohort.py tests/test_hgwind_render_delivery.py
          tests/test_hf_archive.py tests/test_prediction_metrics.py tests/test_chunk_execution.py tests/test_publication.py
        env:
          PYTHONPATH: src
