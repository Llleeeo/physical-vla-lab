name: CPU contract checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-cpu.txt
      - run: python -m pip check
      - run: python scripts/check_publication.py
      - run: >-
          python -m pytest -q
          tests/test_hgwind_cohort.py tests/test_hgwind_render_delivery.py
          tests/test_hf_archive.py tests/test_prediction_metrics.py tests/test_chunk_execution.py tests/test_publication.py tests/test_trajectory_quality.py tests/test_recorded_franka.py tests/test_hgwind_effort_probe.py tests/test_grasp_evidence.py tests/test_live_kinematics.py tests/test_cartesian_target_trace.py tests/test_cartesian_target_replay.py tests/test_cartesian_packets.py tests/test_ball_action_contract.py tests/test_contract_batch.py tests/test_hgwind_startup_trace.py tests/test_hgwind_history.py tests/test_inotify_preflight.py tests/test_setup_force_control.py tests/test_gripper_drive_trace.py tests/test_gripper_gain_control.py tests/test_initialized_contract.py tests/test_action_precision_control.py tests/test_mimic_drive_control.py tests/test_hgwind_development_data.py tests/test_ball_prediction_metrics.py tests/test_ball_live_policy.py tests/test_ball_visual_geometry.py tests/test_ball_approach_guard.py tests/test_ball_approach_audit.py tests/test_ball_camera_protocol.py tests/test_ball_refinement.py tests/test_ball_vertical_diagnostic.py tests/test_ball_smoothing.py tests/test_ball_precision.py tests/test_ball_sampling_diagnostic.py tests/test_ball_noise_replanning.py tests/test_ball_prefix_loss.py tests/test_ball_servo_loss.py
        env:
          PYTHONPATH: src
          HF_HUB_OFFLINE: '1'
